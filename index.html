<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentVora | Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff8e8;
  color: #390d1b;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 30px 24px;
  border-radius: 18px;
  border: 1px solid #d4af37;
  box-shadow: 0 8px 25px #390d1b18;
}

h1 {
  text-align: center;
  color: #390d1b;
  margin-bottom: 8px;
}

.gold {
  color: #b18a13;
}

.subtitle {
  text-align: center;
  color: #79515b;
  margin-bottom: 25px;
  line-height: 1.5;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d4af37;
  border-radius: 8px;
  font-size: 15px;
}

.password-box {
  display: flex;
  align-items: center;
  border: 1px solid #d4af37;
  border-radius: 8px;
  overflow: hidden;
}

.password-box input {
  border: none;
  outline: none;
}

.eye {
  padding: 10px;
  cursor: pointer;
  background: white;
  border: none;
  font-size: 20px;
}

.login-btn {
  width: 100%;
  padding: 13px;
  margin-top: 23px;
  border: none;
  border-radius: 9px;
  background: #390d1b;
  color: #f3d782;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.login-btn:hover {
  background: #581c2d;
}

.bottom {
  text-align: center;
  margin-top: 20px;
  line-height: 1.8;
}

a {
  color: #8a6410;
  font-weight: bold;
}

#message {
  margin-top: 12px;
  color: #a00020;
  font-size: 14px;
  text-align: center;
}
</style>
</head>

<body>

<main class="login-box">
  <h1>✨ Talent<span class="gold">Vora</span></h1>
  <p class="subtitle">Your talent deserves the world!</p>

  <form id="loginForm">
    <label for="email">Email Address</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <div class="password-box">
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >
      <button class="eye" type="button" id="togglePassword"
        aria-label="Show password">👁️</button>
    </div>

    <button class="login-btn" type="submit">Login →</button>
    <p id="message" aria-live="polite"></p>
  </form>

  <div class="bottom">
    Don't have an account?<br>
    <a href="signup.html">Create an account</a>
  </div>
</main>

<script>
const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");

toggle.addEventListener("click", () => {
  const hidden = password.type === "password";
  password.type = hidden ? "text" : "password";
  toggle.textContent = hidden ? "🙈" : "👁️";
  toggle.setAttribute(
    "aria-label",
    hidden ? "Hide password" : "Show password"
  );
});

document.getElementById("loginForm").addEventListener("submit", event => {
  event.preventDefault();

  document.getElementById("message").textContent = "";
  window.location.href = "dashboard.html";
});
</script>

</body>
</html>
