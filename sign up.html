
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentVora | Sign Up</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #390D1B;
  color: #390D1B;
}

.container {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.logo {
  color: #D4AF37;
  font-size: 32px;
  font-weight: bold;
}

.tagline {
  color: #F3D782;
  margin-bottom: 24px;
}

.signup-box {
  background: #FFF8E8;
  padding: 25px;
  border-radius: 18px;
}

h2 { margin-top: 0; }

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #D9C8CB;
  border-radius: 8px;
  font-size: 15px;
  outline-color: #D4AF37;
}

.field { margin: 12px 0; }

.password-box {
  display: flex;
  align-items: center;
  border: 1px solid #D9C8CB;
  border-radius: 8px;
  background: white;
}

.password-box input {
  border: none;
  background: transparent;
  min-width: 0;
}

.eye {
  border: none;
  background: transparent;
  color: #801F40;
  width: 44px;
  padding: 8px;
  cursor: pointer;
  font-size: 20px;
}

.submit {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #D4AF37;
  color: #390D1B;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

a {
  color: #801F40;
  font-weight: bold;
}

.message {
  color: #801F40;
  font-size: 14px;
}
</style>
</head>
<body>
<main class="container">
  <div class="logo">✦ TalentVora</div>
  <p class="tagline">Your Talent. Your Stage. Your World.</p>

  <form class="signup-box" onsubmit="signup(event)">
    <h2>Create Account</h2>
    <p>Join our global talent community!</p>

    <div class="field">
      <input id="name" type="text"
        placeholder="Full name" autocomplete="name" required>
    </div>

    <div class="field">
      <input id="email" type="email"
        placeholder="Email address"
        autocomplete="email" required>
    </div>

    <div class="field password-box">
      <input id="password" type="password"
        placeholder="Create password"
        autocomplete="new-password" required minlength="8">
      <button class="eye" type="button"
        onclick="togglePassword('password', this)"
        aria-label="Show password"
        aria-pressed="false">👁</button>
    </div>

    <div class="field password-box">
      <input id="confirm" type="password"
        placeholder="Confirm password"
        autocomplete="new-password" required minlength="8">
      <button class="eye" type="button"
        onclick="togglePassword('confirm', this)"
        aria-label="Show confirm password"
        aria-pressed="false">👁</button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <button class="submit" type="submit">
      CREATE ACCOUNT
    </button>

    <p>Already have an account?
      <a href="index.html">Log In</a>
    </p>
  </form>
</main>

<script>
function togglePassword(id, button) {
  const field = document.getElementById(id);
  const showing = field.type === "password";

  field.type = showing ? "text" : "password";
  button.textContent = showing ? "🙈" : "👁";
  button.setAttribute("aria-pressed", String(showing));
  button.setAttribute(
    "aria-label",
    showing ? "Hide password" : "Show password"
  );
}

function signup(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const message = document.getElementById("message");

  if (password !== confirm) {
    message.textContent = "Passwords do not match.";
    return;
  }

  message.textContent =
    "Signup design is ready! Real account creation will be connected next.";
}
</script>
</body>
</html>
